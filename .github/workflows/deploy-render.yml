name: Deploy Render (nightly)

on:
  schedule:
    - cron: '0 23 * * *' # 01:00 en España en verano (UTC+2)
    - cron: '0 0 * * *' # 01:00 en España en invierno (UTC+1)
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy of the latest commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Europe/Madrid date +%H)" != "01" ]; then
            echo "No es la 01:00 en Madrid, se omite"; exit 0
          fi
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Falta el secreto RENDER_DEPLOY_HOOK_URL" >&2
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
